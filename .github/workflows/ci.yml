name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/DeckhandKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/DeckhandKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift test
        working-directory: Packages/DeckhandKit
        # Live tests against real servers are skipped: they need DECKHAND_TEST_* settings.
        run: swift test

  app:
    name: App build
    # Release PRs (label "release"), version tags and manual runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: >-
          xcodebuild -project Deckhand.xcodeproj -scheme Deckhand
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/dd -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO build
